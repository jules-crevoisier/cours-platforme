# Build des images Docker sur GitHub Actions (le petit serveur Dokploy ne compile plus rien :
# il tire les images depuis ghcr.io). Voir docs/github-ci.md.
#   main -> :main (prod)      test -> :test (recette, avec données de démo)
name: docker

on:
  pull_request:
  push:
    branches: [main, test]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: app
            target: runner
          - name: migrate
            target: ${{ github.ref_name == 'test' && 'seeder' || 'migrator' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: img
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: PEERTUBE_HOSTS=${{ vars.PEERTUBE_HOSTS }}
          tags: |
            ${{ steps.img.outputs.repo }}/${{ matrix.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.repo }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ github.ref_name }}

  # Optionnel : secrets DOKPLOY_WEBHOOK_MAIN / DOKPLOY_WEBHOOK_TEST (webhook de déploiement Dokploy)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          HOOK: ${{ github.ref_name == 'main' && secrets.DOKPLOY_WEBHOOK_MAIN || secrets.DOKPLOY_WEBHOOK_TEST }}
        run: |
          if [ -z "$HOOK" ]; then echo "pas de webhook Dokploy configuré, déployer à la main"; exit 0; fi
          curl -fsS -X POST "$HOOK"
