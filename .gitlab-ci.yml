# Build des images Docker dans GitLab CI (le petit serveur Dokploy ne compile plus rien :
# il ne fait que `docker pull` + `docker compose up`). Voir docs/gitlab-ci.md.
#
#   main -> :main (prod)      test -> :test (recette, avec données de démo)
#
# Images publiées dans le registry GitLab du projet :
#   $CI_REGISTRY_IMAGE/app:<tag>      runtime Next.js (target runner)
#   $CI_REGISTRY_IMAGE/migrate:<tag>  migrations (target migrator) ; sur `test` : migrations + démo (target seeder)

stages: [check, build, deploy]

variables:
  DOCKER_BUILDKIT: "1"
  DOCKER_TLS_CERTDIR: "/certs"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test"

check:
  stage: check
  image: node:24-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm test

.docker:
  image: docker:27
  services: ["docker:27-dind"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker buildx create --use --driver docker-container

# Une image par target ; le cache est stocké dans le registry (build suivant = couches réutilisées).
build:
  extends: .docker
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test"
  script:
    - MIGRATE_TARGET=migrator
    - if [ "$CI_COMMIT_BRANCH" = "test" ]; then MIGRATE_TARGET=seeder; fi
    - |
      build() { # nom target [args...]
        name=$1; target=$2; shift 2
        docker buildx build --target "$target" \
          --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE/$name:cache-$CI_COMMIT_BRANCH" \
          --cache-to   "type=registry,ref=$CI_REGISTRY_IMAGE/$name:cache-$CI_COMMIT_BRANCH,mode=max" \
          -t "$CI_REGISTRY_IMAGE/$name:$CI_COMMIT_BRANCH" \
          -t "$CI_REGISTRY_IMAGE/$name:$CI_COMMIT_SHORT_SHA" \
          "$@" --push .
      }
    - build app runner --build-arg "PEERTUBE_HOSTS=${PEERTUBE_HOSTS:-}"
    - build migrate "$MIGRATE_TARGET"

# Optionnel : déclenche le redéploiement Dokploy (variables DOKPLOY_WEBHOOK_MAIN / DOKPLOY_WEBHOOK_TEST,
# URL de webhook de l'application Dokploy). Sans variable, le job est ignoré -> déployer à la main.
deploy:
  stage: deploy
  image: curlimages/curl:8.11.1
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $DOKPLOY_WEBHOOK_MAIN
      variables: { HOOK: $DOKPLOY_WEBHOOK_MAIN }
    - if: $CI_COMMIT_BRANCH == "test" && $DOKPLOY_WEBHOOK_TEST
      variables: { HOOK: $DOKPLOY_WEBHOOK_TEST }
  script:
    - curl -fsS -X POST "$HOOK"
